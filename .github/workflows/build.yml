name: Build exe

# Builds dist/PortableProgramManager.exe with PyInstaller.
# - Every push to main and every manual run: the exe is uploaded as a workflow
#   artifact (Actions → this run → Artifacts).
# - Pushing a version tag (e.g. v0.9.0): also publishes a GitHub Release with
#   the exe and its SHA-256 attached. The tag must match __version__.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path src/portable_manager/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match __version__ $version"
            exit 1
          }

      - name: Run tests
        run: python -m pytest

      - name: Build exe
        run: |
          python tools/make_version_info.py
          python -m PyInstaller --noconfirm --clean PortableProgramManager.spec

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/PortableProgramManager.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PortableProgramManager.exe" | Out-File -Encoding ascii dist/PortableProgramManager.exe.sha256
          (Get-Item dist/PortableProgramManager.exe).VersionInfo | Format-List FileVersion, ProductName
          Get-Content dist/PortableProgramManager.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PortableProgramManager-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            dist/PortableProgramManager.exe
            dist/PortableProgramManager.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PortableProgramManager-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/PortableProgramManager.exe dist/PortableProgramManager.exe.sha256 \
            --repo "${{ github.repository }}" \
            --title "Portable Program Manager ${{ github.ref_name }}" \
            --generate-notes
